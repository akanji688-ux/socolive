<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SocoLive – Xem Bóng Đá Trực Tuyến</title>
  <link rel="icon" type="image/png" href="/images/logo.png">
  <link rel="stylesheet" href="style.css?v=fav" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;700;800&display=swap" rel="stylesheet" />
</head>
<body>
  <!-- Background layer — hiển thị ảnh nền phía sau toàn bộ trang -->
  <div id="bgLayer"></div>

  <!-- HEADER -->
  <header class="header">
    <div class="container header-inner">
      <a href="/" class="logo-img-wrap" id="logoText">
        <img src="/images/logo.png" alt="SocoLive" class="logo-img" onerror="this.style.display='none';this.nextElementSibling.style.display='inline'" />
        <span class="logo logo-fallback" style="display:none">⚽ SocoLive</span>
      </a>
      <nav class="nav" id="mainNav"></nav>
      <button class="hamburger" id="hamburger" aria-label="Menu">&#9776;</button>
    </div>
    <div class="mobile-menu" id="mobileMenu">
      <nav id="mobileNav"></nav>
      <a id="logoMobile" href="/" class="logo" style="font-size:1rem"></a>
    </div>
  </header>

  <!-- BANNER SLIDER -->
  <section class="slider-section">
    <div class="slider" id="slider"></div>
    <button class="slider-btn prev" id="prevBtn" aria-label="Previous">&#8592;</button>
    <button class="slider-btn next" id="nextBtn" aria-label="Next">&#8594;</button>
    <div class="slider-dots" id="sliderDots"></div>
  </section>

  <!-- 3 BUTTONS -->
  <section class="features" id="features">
    <div class="container">
      <h2 class="section-title">Khám Phá SocoLive</h2>
      <p class="section-sub">Tất cả những gì bạn cần cho trải nghiệm bóng đá đỉnh cao</p>
      <div class="btn-grid" id="btnGrid"></div>
    </div>
  </section>


<script src="app.js?v=4"></script>
</body>
</html>
